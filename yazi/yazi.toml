# ============================================================
# CONFIGURATION GÉNÉRALE DE YAZI
# ============================================================

[mgr]
show_hidden = true
sort_dir_first = true


# ============================================================
# PROGRAMMES D’OUVERTURE
# ============================================================

[opener]

# Ouvre les éléments sélectionnés dans Visual Studio Code.
edit = [
	{ run = 'code "$@"', desc = "Open in VS Code", block = false, for = "macos" },
]


# ============================================================
# RÈGLES D’OUVERTURE
# ============================================================

[open]

prepend_rules = [
	# Dossiers
	{ url = "*/", use = "edit" },

	# Fichiers texte et fichiers de programmation
	{ mime = "text/*", use = "edit" },

	# Formats de code qui ne sont pas toujours détectés comme text/*
	{ url = "*.{c,h,cpp,hpp,cc,java,ml,mli,py,js,jsx,ts,tsx,html,css,scss,json,toml,yaml,yml,xml,sh,zsh,bash,sql,md}", use = "edit" },
]